name: Place awardbound JS
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/place-awardbound-js.yml
permissions:
  contents: write
jobs:
  place:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch exact bundle
        run: |
          set -euo pipefail
          mkdir -p awardbound/assets
          curl -fsSL -o awardbound/assets/index-GHWhHSzk.js https://litter.catbox.moe/afwbq4.js
          python3 -c "
          import hashlib
          d=open('awardbound/assets/index-GHWhHSzk.js','rb').read()
          h=hashlib.sha256(d).hexdigest()
          assert len(d)==269866, len(d)
          assert h=='2b51e85505d410cb65ae99e9bf7035d7b3a4231b004e54c2931028686103c075', h
          print('ok', len(d), h)
          "
      - name: Commit bundle and remove temp parts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -r --ignore-unmatch awardbound/assets/.parts || true
          git add awardbound/assets/index-GHWhHSzk.js
          git commit -m "Add awardbound/assets/index-GHWhHSzk.js"
          git push
